name: EcoTrack CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Install backend dependencies
        run: npm --prefix backend install
      - name: Check backend JavaScript syntax
        run: |
          node --check backend/src/server.js
          node --check backend/src/routes/readings.js
          node --check backend/src/models/EnergyReading.js
          node --check backend/src/utils/energy.js
      - name: Run backend unit tests
        run: npm --prefix backend test
